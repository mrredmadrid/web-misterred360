<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="MISTERRED360 · Ponemos el alma. Medimos al milímetro.">
  <!-- Fondo negro corporativo -->
  <rect width="1200" height="630" fill="#08080A"/>

  <!-- Glow rojo sutil arriba a la derecha -->
  <defs>
    <radialGradient id="glow" cx="80%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#E8262B" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#E8262B" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Sello circular tipo insignia · izquierda -->
  <g transform="translate(230,315)">
    <circle r="150" fill="none" stroke="#E8262B" stroke-width="4"/>
    <circle r="6" fill="#E8262B"/>
    <text x="0" y="-190" text-anchor="middle" fill="#97959A" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="8">MADRID · 2011</text>
    <text x="0" y="215" text-anchor="middle" fill="#97959A" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="8">AGENCIA 360</text>
  </g>

  <!-- Barra roja separadora -->
  <rect x="440" y="80" width="4" height="470" fill="#E8262B"/>

  <!-- Wordmark -->
  <text x="490" y="230" fill="#F2EFE7" font-family="Clash Display, Helvetica, Arial, sans-serif" font-size="96" font-weight="700" letter-spacing="-2">MISTER<tspan fill="#E8262B">RED</tspan>360<tspan fill="#E8262B" font-size="48" dy="-40">°</tspan></text>

  <!-- Slogan -->
  <text x="490" y="340" fill="#F2EFE7" font-family="Clash Display, Helvetica, Arial, sans-serif" font-size="46" font-weight="600" letter-spacing="-1">Ponemos el alma.</text>
  <text x="490" y="400" fill="#E8262B" font-family="Clash Display, Helvetica, Arial, sans-serif" font-size="46" font-weight="600" letter-spacing="-1">Medimos al milímetro.</text>

  <!-- Línea + descriptor -->
  <line x1="490" y1="450" x2="590" y2="450" stroke="#E8262B" stroke-width="2"/>
  <text x="490" y="490" fill="#97959A" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" letter-spacing="6">AGENCIA DE COMUNICACIÓN 360 · MADRID</text>
  <text x="490" y="522" fill="#6B6A70" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="16" letter-spacing="1">misterred360.es · Contesta una persona, en 24 h.</text>
</svg>
