# ═══════════════════════════════════════════════════════════
#  MISTERRED360 · Nginx (VPS OVHcloud)
#  Copiar en /etc/nginx/sites-available/misterred360.es
#  y enlazar: ln -s /etc/nginx/sites-available/misterred360.es
#                   /etc/nginx/sites-enabled/
# ═══════════════════════════════════════════════════════════

server {
    listen 80;
    listen [::]:80;
    server_name misterred360.es www.misterred360.es;

    root /var/www/misterred360;
    index index.html;
    charset utf-8;

    # Rutas hash (#/...): todo se sirve desde index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Redirigir www → dominio canónico
    if ($host = www.misterred360.es) {
        return 301 https://misterred360.es$request_uri;
    }

    # Assets estáticos con caché larga
    location ~* \.(?:jpg|jpeg|png|webp|svg|ico|woff2?|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # HTML siempre fresco
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Compresión
    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Seguridad
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Certbot añadirá aquí el bloque SSL (listen 443) automáticamente
}
